<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="gradFat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#312e81;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3730a3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4338ca;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconFatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <pattern id="gridFat" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>
    <filter id="shadowFat" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#gradFat)" />
  <rect width="800" height="450" fill="url(#gridFat)" />

  <circle cx="400" cy="130" r="130" fill="#818cf8" opacity="0.15" filter="blur(40px)" />
  <circle cx="720" cy="380" r="160" fill="#4338ca" opacity="0.2" filter="blur(50px)" />

  <g transform="translate(400, 125)" filter="url(#shadowFat)">
    <rect x="-48" y="-48" width="96" height="96" rx="26" fill="rgba(255, 255, 255, 0.12)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" />
    <rect x="-40" y="-40" width="80" height="80" rx="20" fill="url(#iconFatGrad)" />
    <!-- Ícone de Nota Fiscal / Documento -->
    <rect x="-18" y="-22" width="36" height="44" rx="4" fill="#ffffff"/>
    <line x1="-10" y1="-12" x2="10" y2="-12" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-10" y1="-4" x2="10" y2="-4" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-10" y1="4" x2="4" y2="4" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="6" cy="12" r="4" fill="#10b981"/>
  </g>

  <text x="400" y="245" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.6))">
    Faturamento e Vendas
  </text>

  <text x="400" y="295" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="22" font-weight="500" fill="rgba(255,255,255,0.9)" text-anchor="middle" filter="drop-shadow(0 2px 6px rgba(0,0,0,0.5))">
    Emissão de notas fiscais, pedidos e relatórios
  </text>

  <g transform="translate(400, 360)">
    <rect x="-105" y="-18" width="210" height="36" rx="18" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
    <text x="0" y="6" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
      MAESTRIA TECH
    </text>
  </g>
</svg>