<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1c1032;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2a164d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b1d6e;stop-opacity:1" />
    </linearGradient>
