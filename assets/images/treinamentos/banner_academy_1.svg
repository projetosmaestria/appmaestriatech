<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b1329;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#11224d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a365d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f2fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4facfe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:0.35" />
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:0" />
    </linearGradient>
    <pattern id="gridPattern1" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
    <radialGradient id="sphereGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:0.8" />
      <stop offset="70%" style="stop-color:#1e40af;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </radialGradient>
    <filter id="glowBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Fundo com Gradiente Profundo -->
  <rect width="1400" height="560" fill="url(#bgGrad1)" />
  <rect width="1400" height="560" fill="url(#gridPattern1)" />

  <!-- Efeitos de Luz e Néon de Fundo -->
  <circle cx="1150" cy="180" r="260" fill="#0284c7" opacity="0.25" filter="url(#glowBlur)" />
  <circle cx="1300" cy="420" r="220" fill="#6366f1" opacity="0.2" filter="url(#glowBlur)" />
  <circle cx="200" cy="100" r="180" fill="#0369a1" opacity="0.15" filter="url(#glowBlur)" />

  <!-- Linhas Tecnológicas Decorativas -->
  <path d="M 600 -50 L 1450 480" stroke="url(#accentGlow)" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 750 -50 L 1550 420" stroke="url(#accentGlow)" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M 900 -50 L 1650 360" stroke="url(#accentGlow)" stroke-width="1" fill="none" opacity="0.3"/>

  <!-- Composição Gráfica Tecnológica no Lado Direito (Área Livre de Textos) -->
  <g transform="translate(1080, 270)">
    <!-- Plataforma / Base Flutuante -->
    <ellipse cx="0" cy="140" rx="200" ry="45" fill="rgba(255,255,255,0.04)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2" />
    <ellipse cx="0" cy="140" rx="140" ry="30" fill="rgba(56, 189, 248, 0.08)" />

    <!-- Elementos Flutuantes em Vidro / Tech Cards -->
    <g transform="translate(-110, -90)">
      <rect width="130" height="90" rx="14" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.5))"/>
      <circle cx="30" cy="30" r="14" fill="rgba(56, 189, 248, 0.25)"/>
      <path d="M 24 30 L 28 34 L 37 25" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <rect x="52" y="24" width="60" height="6" rx="3" fill="rgba(255,255,255,0.7)"/>
      <rect x="20" y="55" width="90" height="5" rx="2.5" fill="rgba(255,255,255,0.2)"/>
      <rect x="20" y="67" width="65" height="5" rx="2.5" fill="rgba(56, 189, 248, 0.6)"/>
    </g>

    <g transform="translate(30, -50)">
      <rect width="140" height="95" rx="14" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.5" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.5))"/>
      <rect x="20" y="22" width="100" height="6" rx="3" fill="rgba(255,255,255,0.8)"/>
      <rect x="20" y="38" width="75" height="5" rx="2.5" fill="rgba(255,255,255,0.3)"/>
      <rect x="20" y="55" width="25" height="25" rx="6" fill="rgba(99, 102, 241, 0.3)"/>
      <rect x="55" y="60" width="65" height="6" rx="3" fill="#818cf8"/>
      <rect x="55" y="72" width="40" height="4" rx="2" fill="rgba(255,255,255,0.2)"/>
    </g>

    <!-- Ícone Central 3D / Emblema de Capacitação -->
    <g transform="translate(-10, 20)">
      <circle cx="0" cy="0" r="48" fill="url(#sphereGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="2" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.6))"/>
      <!-- Chapéu de Formatura / Graduação Vetorial -->
      <path d="M 0 -18 L 30 -6 L 0 6 L -30 -6 Z" fill="#ffffff" />
      <path d="M -20 2 L -20 16 C -20 22 20 22 20 16 L 20 2" fill="none" stroke="#ffffff" stroke-width="2.5" />
      <path d="M 22 -3 L 26 18 C 26 20 23 21 21 21" fill="none" stroke="#38bdf8" stroke-width="2" />
    </g>

    <!-- Pontos Luminosos Orbitais -->
    <circle cx="-130" cy="40" r="4" fill="#38bdf8" filter="drop-shadow(0 0 6px #38bdf8)"/>
    <circle cx="120" cy="-110" r="5" fill="#818cf8" filter="drop-shadow(0 0 8px #818cf8)"/>
    <circle cx="160" cy="60" r="3" fill="#34d399" filter="drop-shadow(0 0 5px #34d399)"/>
  </g>
</svg>