<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="gradFin1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#311042;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#831843;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconFinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f43f5e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e11d48;stop-opacity:1" />
    </linearGradient>
    <pattern id="gridFin" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>
    <filter id="shadowFin" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Fundo com Gradiente Sofisticado -->
  <rect width="800" height="450" fill="url(#gradFin1)" />
  <rect width="800" height="450" fill="url(#gridFin)" />

  <!-- Círculos e Efeitos de Brilho de Fundo (Livres dos cantos superiores) -->
  <circle cx="400" cy="130" r="130" fill="#f43f5e" opacity="0.15" filter="blur(40px)" />
  <circle cx="720" cy="380" r="160" fill="#9d174d" opacity="0.2" filter="blur(50px)" />
  <circle cx="80" cy="380" r="140" fill="#431407" opacity="0.2" filter="blur(40px)" />

  <!-- ÍCONE TEMÁTICO CENTRAL GRANDE E IMPONENTE -->
  <g transform="translate(400, 125)" filter="url(#shadowFin)">
    <!-- Base Circular do Ícone -->
    <rect x="-48" y="-48" width="96" height="96" rx="26" fill="rgba(255, 255, 255, 0.12)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2" />
    <rect x="-40" y="-40" width="80" height="80" rx="20" fill="url(#iconFinGrad)" />
    
    <!-- Símbolo de Cartão de Crédito e Cifrão Vetorial -->
    <rect x="-24" y="-18" width="48" height="34" rx="6" fill="#ffffff" opacity="0.95" />
    <rect x="-24" y="-11" width="48" height="7" fill="#be123c" />
    <rect x="-18" y="3" width="12" height="6" rx="2" fill="#fda4af" />
    <circle cx="14" cy="6" r="4" fill="#fb7185" />
  </g>

  <!-- TIPOGRAFIA DO CURSO GRANDE, FORTE E PERFEITAMENTE CENTRALIZADA -->
  <!-- Título com tamanho 44px (visível e nítido mesmo em miniatura) -->
  <text x="400" y="245" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.6))">
    Formas de Pagamento
  </text>

  <!-- Subtítulo / Descrição da Capa grande e legível -->
  <text x="400" y="295" font-family="'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="22" font-weight="500" fill="rgba(255,255,255,0.9)" text-anchor="middle" filter="drop-shadow(0 2px 6px rgba(0,0,0,0.5))">
    Configurações completas e taxas operacionais
  </text>

  <!-- Selo Institucional Centralizado na Base (Longe das badges superiores) -->
  <g transform="translate(400, 360)">
    <rect x="-105" y="-18" width="210" height="36" rx="18" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
    <text x="0" y="6" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
      MAESTRIA TECH
    </text>
  </g>
</svg>