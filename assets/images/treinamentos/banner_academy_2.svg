<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#091924;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0f2e3d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#134e4a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <pattern id="gridPattern2" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
    <filter id="glowBlur2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Fundo -->
  <rect width="1400" height="560" fill="url(#bgGrad2)" />
  <rect width="1400" height="560" fill="url(#gridPattern2)" />

  <!-- Efeitos de Luz -->
  <circle cx="1150" cy="200" r="260" fill="#14b8a6" opacity="0.22" filter="url(#glowBlur2)" />
  <circle cx="1300" cy="400" r="200" fill="#0d9488" opacity="0.2" filter="url(#glowBlur2)" />

  <!-- Composição Financeira / Gráfica no Lado Direito -->
  <g transform="translate(1080, 270)">
    <ellipse cx="0" cy="140" rx="190" ry="40" fill="rgba(255,255,255,0.03)" stroke="rgba(20, 184, 166, 0.3)" stroke-width="2" />

    <!-- Cards de Métricas Financeiras Flutuantes -->
    <g transform="translate(-110, -80)">
      <rect width="130" height="85" rx="12" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(20, 184, 166, 0.4)" stroke-width="1.5" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.5))"/>
      <circle cx="28" cy="28" r="12" fill="rgba(16, 185, 129, 0.25)"/>
      <text x="28" y="33" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#10b981" text-anchor="middle">$</text>
      <rect x="48" y="22" width="65" height="5" rx="2.5" fill="rgba(255,255,255,0.7)"/>
      <path d="M 20 65 L 45 48 L 70 56 L 105 38" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <g transform="translate(30, -40)">
      <rect width="130" height="90" rx="12" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(45, 212, 191, 0.4)" stroke-width="1.5" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.5))"/>
      <rect x="20" y="20" width="90" height="5" rx="2.5" fill="rgba(255,255,255,0.8)"/>
      <rect x="20" y="34" width="60" height="4" rx="2" fill="rgba(255,255,255,0.3)"/>
      <rect x="20" y="52" width="22" height="24" rx="4" fill="#0d9488"/>
      <rect x="48" y="58" width="16" height="18" rx="4" fill="#14b8a6"/>
      <rect x="70" y="44" width="16" height="32" rx="4" fill="#2dd4bf"/>
      <rect x="92" y="38" width="16" height="38" rx="4" fill="#5eead4"/>
    </g>

    <!-- Círculo Central com Símbolo de Conciliação/Finanças -->
    <g transform="translate(-10, 20)">
      <circle cx="0" cy="0" r="46" fill="url(#emeraldGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="2" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.5))"/>
      <text x="0" y="10" font-family="'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">R$</text>
    </g>

    <circle cx="-120" cy="30" r="4" fill="#2dd4bf" filter="drop-shadow(0 0 6px #2dd4bf)"/>
    <circle cx="110" cy="-100" r="5" fill="#34d399" filter="drop-shadow(0 0 8px #34d399)"/>
  </g>
</svg>